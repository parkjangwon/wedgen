<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>페이퍼 콜라주</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="paper-collage" data-layout="collage-cards">
    <div class="collage-scrapbook">
      <div class="card-stack card-main" data-section="hero"></div>

      <div class="card-pile">
        <div class="scrap-card card-tilt-left" data-section="greeting"></div>
        <div class="scrap-card card-tilt-right" data-section="gallery"></div>
        <div class="scrap-card card-tilt-left" data-section="family"></div>
      </div>

      <div class="card-memories">
        <div class="memory-slip" data-section="schedule"></div>
        <div class="memory-slip" data-section="location"></div>
        <div class="memory-slip" data-section="account"></div>
      </div>

      <div class="card-closing" data-section="ending"></div>
    </div>
    <script src="script.js" defer></script>
  </body>
  </html>
