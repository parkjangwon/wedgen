<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>빈티지 필름</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="vintage-film" data-layout="vintage-film-strip">
    <main class="film-shell">
      <header class="film-frame" data-section="hero"></header>
      <section class="film-strip" data-section="gallery"></section>
      <section class="film-frame" data-section="schedule"></section>
      <section class="film-frame" data-section="greeting"></section>
      <section class="film-reel">
        <article class="film-frame" data-section="location"></article>
        <article class="film-frame" data-section="family"></article>
      </section>
      <section class="film-frame" data-section="account"></section>
      <footer class="film-frame" data-section="ending"></footer>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
