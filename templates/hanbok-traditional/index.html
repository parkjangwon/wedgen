<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hanbok-traditional</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="hanbok-traditional" data-layout="hanbok-traditional">
    <div class="cherry-container">
      <header class="cherry-hero" data-section="hero"></header>
      <main class="cherry-content">
        <section class="cherry-section" data-section="greeting"></section>
        <section class="cherry-section" data-section="gallery"></section>
        <section class="cherry-section" data-section="schedule"></section>
        <section class="cherry-section" data-section="location"></section>
        <section class="cherry-section" data-section="family"></section>
        <section class="cherry-section" data-section="account"></section>
      </main>
      <footer class="cherry-ending" data-section="ending"></footer>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
