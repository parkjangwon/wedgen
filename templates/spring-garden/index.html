<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>봄 정원</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="spring-garden" data-layout="spring-garden-grid">
    <main class="garden-shell">
      <header class="garden-hero" data-section="hero"></header>
      <section class="garden-wide" data-section="greeting"></section>
      <section class="garden-grid">
        <article class="garden-card" data-section="schedule"></article>
        <article class="garden-card" data-section="family"></article>
        <article class="garden-card" data-section="gallery"></article>
        <article class="garden-card" data-section="location"></article>
      </section>
      <section class="garden-wide" data-section="account"></section>
      <footer class="garden-ending" data-section="ending"></footer>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
