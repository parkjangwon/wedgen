<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모던 미니멀</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="modern-minimal" data-layout="single-page">
    <main class="single-flow">
      <header class="flow-hero" data-section="hero"></header>

      <section class="flow-section flow-summary" data-section="summary">
        <div class="container"></div>
      </section>

      <section class="flow-section" data-section="schedule">
        <div class="container"></div>
      </section>

      <section class="flow-section flow-split" data-section="greeting">
        <div class="container"></div>
      </section>

      <section class="flow-section" data-section="gallery">
        <div class="container"></div>
      </section>

      <section class="flow-section flow-compact" data-section="location">
        <div class="container"></div>
      </section>

      <section class="flow-section flow-compact" data-section="family">
        <div class="container"></div>
      </section>

      <section class="flow-section flow-compact" data-section="account">
        <div class="container"></div>
      </section>

      <footer class="flow-footer" data-section="ending"></footer>
    </main>

    <nav class="page-nav" aria-label="페이지 낸비게이션">
      <div class="nav-dots"></div>
    </nav>

    <script src="script.js" defer></script>
  </body>
</html>
