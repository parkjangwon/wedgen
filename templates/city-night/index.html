<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>도시 야경</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="city-night" data-layout="city-lights">
    <main class="city-lights">
      <section class="city-block hero" data-section="hero"></section>
      <section class="city-block" data-section="schedule"></section>
      <section class="city-block" data-section="greeting"></section>
      <section class="city-block" data-section="gallery"></section>
      <section class="city-block" data-section="family"></section>
      <section class="city-block" data-section="location"></section>
      <section class="city-block" data-section="account"></section>
      <section class="city-block" data-section="guestbook"></section>
      <footer class="city-block ending" data-section="ending"></footer>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
