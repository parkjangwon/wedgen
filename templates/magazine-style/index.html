<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>매거진 스타일</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="magazine-style" data-layout="editorial-story">
    <div class="magazine-container">
      <header class="magazine-header" data-section="hero"></header>

      <article class="editorial-feature" data-section="greeting"></article>

      <div class="editorial-spread">
        <aside class="spread-sidebar" data-section="family"></aside>
        <main class="spread-content" data-section="gallery"></main>
      </div>

      <section class="editorial-timeline" data-section="schedule"></section>

      <div class="editorial-spread spread-reverse">
        <main class="spread-content" data-section="location"></main>
        <aside class="spread-sidebar" data-section="account"></aside>
      </div>

      <footer class="magazine-footer" data-section="ending"></footer>
    </div>
    <script src="script.js" defer></script>
  </body>
  </html>
