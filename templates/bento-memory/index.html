<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>벤토 메모리</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="bento-memory" data-layout="bento-grid">
    <div class="bento-board">
      <header class="bento-card card-xl" data-section="hero"></header>

      <main class="bento-grid">
        <article class="bento-card card-lg" data-section="gallery"></article>

        <div class="bento-cluster">
          <article class="bento-card card-md" data-section="greeting"></article>
          <article class="bento-card card-sm" data-section="family"></article>
        </div>

        <div class="bento-cluster">
          <article class="bento-card card-sm" data-section="schedule"></article>
          <article class="bento-card card-md" data-section="account"></article>
        </div>

        <article class="bento-card card-lg" data-section="location"></article>

        <div class="bento-cluster">
          <article class="bento-card card-sm" data-section="guestbook"></article>
          <article class="bento-card card-sm" data-section="ending"></article>
        </div>
      </main>
    </div>
    <script src="script.js" defer></script>
  </body>
  </html>
