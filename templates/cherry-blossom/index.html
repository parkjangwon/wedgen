<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>벚꽃 테마</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="cherry-blossom" data-layout="cherry-petal-flow">
    <div class="petal-overlay" aria-hidden="true"></div>
    <main class="petal-shell">
      <header class="petal-hero" data-section="hero"></header>
      <section class="petal-card" data-section="schedule"></section>
      <section class="petal-card" data-section="greeting"></section>
      <section class="petal-grid" data-section="gallery"></section>
      <section class="petal-dual">
        <article class="petal-card" data-section="family"></article>
        <article class="petal-card" data-section="location"></article>
      </section>
      <section class="petal-card" data-section="account"></section>
      <footer class="petal-ending" data-section="ending"></footer>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
