<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>코지 크리스마스</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="cozy-christmas" data-layout="cozy-christmas-cardstack">
    <main class="xmas-shell">
      <header class="xmas-hero" data-section="hero"></header>
      <section class="xmas-card" data-section="greeting"></section>
      <section class="xmas-card" data-section="schedule"></section>
      <section class="xmas-card" data-section="gallery"></section>
      <section class="xmas-row">
        <article class="xmas-card" data-section="location"></article>
        <article class="xmas-card" data-section="family"></article>
      </section>
      <section class="xmas-card" data-section="account"></section>
      <footer class="xmas-ending" data-section="ending"></footer>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
