<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우아한 클래식</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="elegant-classic" data-layout="program-book">
    <div class="program-book">
      <header class="book-header">
        <nav class="toc-nav" aria-label="목차">
          <button class="toc-toggle" aria-expanded="false" aria-controls="toc-menu">
            <span class="toc-line"></span>
            <span class="toc-line"></span>
            <span class="toc-line"></span>
          </button>
          <ul id="toc-menu" class="toc-menu" hidden>
            <li><a href="#hero" data-section="hero">표지</a></li>
            <li><a href="#greeting" data-section="greeting">인사말</a></li>
            <li><a href="#family" data-section="family">혼주</a></li>
            <li><a href="#schedule" data-section="schedule">예식 순서</a></li>
            <li><a href="#location" data-section="location">오시는 길</a></li>
            <li><a href="#account" data-section="account">마음 전하실 곳</a></li>
          </ul>
        </nav>
      </header>

      <main class="book-content">
        <article class="page cover-page" id="hero" data-section="hero">
          <div class="page-inner"></div>
        </article>

        <article class="page" id="greeting" data-section="greeting">
          <div class="page-inner"></div>
        </article>

        <article class="page" id="family" data-section="family">
          <div class="page-inner"></div>
        </article>

        <article class="page" id="schedule" data-section="schedule">
          <div class="page-inner"></div>
        </article>

        <article class="page" id="location" data-section="location">
          <div class="page-inner"></div>
        </article>

        <article class="page" id="account" data-section="account">
          <div class="page-inner"></div>
        </article>

        <article class="page back-cover" id="ending" data-section="ending">
          <div class="page-inner"></div>
        </article>
      </main>

      <footer class="book-footer">
        <p class="page-number">1</p>
      </footer>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
