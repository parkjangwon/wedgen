<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>글래스모피즘</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="glass-morphism" data-layout="glass-cards">
    <main class="glass-stage">
      <section class="glass-card hero" data-section="hero"></section>
      <section class="glass-card" data-section="greeting"></section>
      <section class="glass-card" data-section="gallery"></section>
      <section class="glass-card" data-section="schedule"></section>
      <section class="glass-card" data-section="family"></section>
      <section class="glass-card" data-section="location"></section>
      <section class="glass-card" data-section="account"></section>
      <section class="glass-card" data-section="guestbook"></section>
      <footer class="glass-card ending" data-section="ending"></footer>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
