<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>추석 가을</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="harvest-moon" data-layout="harvest-moon-panel">
    <main class="harvest-shell">
      <header class="harvest-hero" data-section="hero"></header>
      <section class="harvest-panel" data-section="greeting"></section>
      <section class="harvest-grid">
        <article class="harvest-panel" data-section="schedule"></article>
        <article class="harvest-panel" data-section="family"></article>
      </section>
      <section class="harvest-panel" data-section="location"></section>
      <section class="harvest-panel" data-section="gallery"></section>
      <section class="harvest-panel" data-section="account"></section>
      <footer class="harvest-ending" data-section="ending"></footer>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
