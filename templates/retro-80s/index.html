<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>80년대 복고</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="retro-80s" data-layout="retro-grid">
    <main class="retro-grid-shell">
      <header class="retro-cell hero-cell" data-section="hero"></header>
      <section class="retro-cell" data-section="schedule"></section>
      <section class="retro-cell" data-section="greeting"></section>
      <section class="retro-cell gallery-cell" data-section="gallery"></section>
      <section class="retro-cell" data-section="family"></section>
      <section class="retro-cell" data-section="location"></section>
      <section class="retro-cell" data-section="account"></section>
      <section class="retro-cell" data-section="guestbook"></section>
      <footer class="retro-cell ending-cell" data-section="ending"></footer>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
