<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>퓨어 화이트</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="clean-white" data-layout="pure-stack">
    <main class="pure-stack">
      <header class="pure-block hero" data-section="hero"></header>
      <section class="pure-block" data-section="greeting"></section>
      <section class="pure-block" data-section="schedule"></section>
      <section class="pure-block" data-section="family"></section>
      <section class="pure-block" data-section="gallery"></section>
      <section class="pure-block" data-section="location"></section>
      <section class="pure-block" data-section="account"></section>
      <section class="pure-block" data-section="guestbook"></section>
      <footer class="pure-block ending" data-section="ending"></footer>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
