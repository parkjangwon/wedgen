<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>세레모니 프로그램</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="ceremony-program" data-layout="ceremony-book">
    <div class="ceremony-book">
      <header class="book-cover" data-section="hero"></header>

      <nav class="ceremony-nav">
        <ol class="nav-list">
          <li><a href="#order">예식 순서</a></li>
          <li><a href="#info">예식 정보</a></li>
          <li><a href="#location">오시는 길</a></li>
        </ol>
      </nav>

      <main class="ceremony-content">
        <section class="ceremony-section" id="order" data-section="schedule"></section>
        <section class="ceremony-section" id="info" data-section="greeting"></section>
        <section class="ceremony-section" id="location" data-section="location"></section>
        <section class="ceremony-section" data-section="family"></section>
        <section class="ceremony-section" data-section="account"></section>
      </main>

      <footer class="book-closing" data-section="ending"></footer>
    </div>
    <script src="script.js" defer></script>
  </body>
  </html>
