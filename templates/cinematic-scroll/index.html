<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시네마틱 스크롤</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="cinematic-scroll" data-layout="hero-centric">
    <div class="cinematic-container">
      <section class="scene scene-hero" data-section="hero" data-scene="hero">
        <div class="scene-content"></div>
        <div class="scene-overlay"></div>
      </section>

      <section class="scene scene-gallery" data-section="gallery" data-scene="gallery">
        <div class="scene-content"></div>
      </section>

      <section class="scene scene-detail" data-section="schedule" data-scene="schedule">
        <div class="scene-content"></div>
      </section>

      <section class="scene scene-detail" data-section="greeting" data-scene="greeting">
        <div class="scene-content"></div>
      </section>

      <section class="scene scene-detail" data-section="location" data-scene="location">
        <div class="scene-content"></div>
      </section>

      <section class="scene scene-detail" data-section="family" data-scene="family">
        <div class="scene-content"></div>
      </section>

      <section class="scene scene-cta" data-section="guestbook" data-scene="guestbook">
        <div class="scene-content"></div>
      </section>

      <section class="scene scene-ending" data-section="ending" data-scene="ending">
        <div class="scene-content"></div>
      </section>
    </div>

    <div class="scene-indicator">
      <div class="progress-bar"></div>
      <span class="scene-counter">1 / 8</span>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
