<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>클래식 포스터</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="classic-poster" data-layout="classic-poster-column">
    <main class="poster-shell">
      <header class="poster-hero" data-section="hero"></header>
      <section class="poster-band" data-section="schedule"></section>
      <section class="poster-body">
        <article class="poster-panel" data-section="greeting"></article>
        <article class="poster-panel" data-section="location"></article>
        <article class="poster-panel" data-section="family"></article>
      </section>
      <section class="poster-band" data-section="gallery"></section>
      <section class="poster-panel" data-section="account"></section>
      <footer class="poster-ending" data-section="ending"></footer>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
