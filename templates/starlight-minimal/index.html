<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스타라이트 미니멀</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="starlight-minimal" data-layout="starlight-hero">
    <div class="starlight-container">
      <div class="starfield" aria-hidden="true">
        <div class="star star-1"></div>
        <div class="star star-2"></div>
        <div class="star star-3"></div>
      </div>

      <header class="starlight-hero" data-section="hero"></header>

      <main class="starlight-minimal">
        <section class="minimal-section" data-section="schedule"></section>
        <section class="minimal-section" data-section="location"></section>
        <section class="minimal-compact" data-section="greeting"></section>
        <section class="minimal-compact" data-section="account"></section>
      </main>

      <footer class="starlight-ending" data-section="ending"></footer>
    </div>
    <script src="script.js" defer></script>
  </body>
  </html>
