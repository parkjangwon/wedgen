<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>눈꽃 테마</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="winter-snow" data-layout="winter-snow-crystal">
    <main class="snow-shell">
      <header class="snow-hero" data-section="hero"></header>
      <section class="snow-line" data-section="schedule"></section>
      <section class="snow-line" data-section="location"></section>
      <section class="snow-grid">
        <article class="snow-card" data-section="greeting"></article>
        <article class="snow-card" data-section="gallery"></article>
      </section>
      <section class="snow-grid">
        <article class="snow-card" data-section="family"></article>
        <article class="snow-card" data-section="account"></article>
      </section>
      <footer class="snow-ending" data-section="ending"></footer>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
