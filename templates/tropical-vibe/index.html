<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>트로피컬 바이브</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-template="tropical-vibe" data-layout="tropical-vibe-island">
    <main class="tropical-shell">
      <header class="tropical-hero" data-section="hero"></header>
      <section class="tropical-strip" data-section="gallery"></section>
      <section class="tropical-card" data-section="greeting"></section>
      <section class="tropical-stack">
        <article class="tropical-card" data-section="schedule"></article>
        <article class="tropical-card" data-section="location"></article>
        <article class="tropical-card" data-section="family"></article>
      </section>
      <section class="tropical-card" data-section="account"></section>
      <footer class="tropical-ending" data-section="ending"></footer>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
